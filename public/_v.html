<!doctype html><meta charset=utf-8>
<style>html,body{margin:0}iframe{width:1440px;height:940px;border:0;display:block}</style>
<iframe id=f></iframe>
<script>
const q = new URLSearchParams(location.search)
fetch('http://localhost:5080/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({email:q.get('u')||'admin@hopital.cm',motDePasse:q.get('p')||'demo1234'})})
 .then(x=>x.json()).then(s=>{ localStorage.setItem('htl.token', s.token)
   const f=document.getElementById('f'); f.src=q.get('r')||'/'
   const o=q.get('onglet'); if(o) f.onload=()=>setTimeout(()=>{const d=f.contentDocument
     const l=[...d.querySelectorAll('.seg-opt')].find(x=>x.textContent.trim().startsWith(o)); l?.querySelector('input')?.click()},900) })
</script>
