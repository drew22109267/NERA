<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;font:13px monospace}#o{padding:10px;background:#0b0b0b;color:#7CFC7C;white-space:pre-wrap}
iframe{width:1400px;height:900px;border:0;position:absolute;left:-4000px}</style>
<div id="o">balayage…</div><iframe id=f></iframe>
<script>
const ROUTES=['/','/patients','/admission','/file','/orientation','/lits','/prevision','/sorties',
 '/demandes','/rendez-vous','/notifications','/rapports','/qualite','/admin','/profil','/mon-espace','/zzz-inconnue']
const out=document.getElementById('o'), f=document.getElementById('f')
const errs=[]
let i=0
function log(t){out.textContent=t}
async function connecte(){
  const r=await fetch('http://localhost:5080/api/auth/login',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:'admin@hopital.cm',motDePasse:'demo1234'})})
  const s=await r.json()
  if(!s.token) throw new Error('login KO')
  localStorage.setItem('htl.token', s.token)
}
function suivant(){
  if(i>=ROUTES.length){
    log(errs.length? 'ERREURS:\n'+errs.join('\n') : 'OK — '+ROUTES.length+' routes, aucune erreur console')
    return
  }
  const r=ROUTES[i++]
  log('… '+r+'  ('+i+'/'+ROUTES.length+')')
  f.onload=()=>{
    const w=f.contentWindow
    w.onerror=(m)=>{errs.push(r+' :: '+m)}
    w.addEventListener('unhandledrejection',(e)=>errs.push(r+' :: promise '+e.reason))
    const ce=w.console.error
    w.console.error=(...a)=>{const t=a.map(String).join(' ')
      if(/Warning:/.test(t)===false) errs.push(r+' :: '+t.slice(0,180)); ce.apply(w.console,a)}
    setTimeout(suivant, 2200)
  }
  f.src=r
}
connecte().then(suivant).catch(e=>log('ECHEC LOGIN '+e.message))
</script>
